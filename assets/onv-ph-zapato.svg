<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shoeLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B36"/>
      <stop offset="50%" stop-color="#1B2924"/>
      <stop offset="100%" stop-color="#121D19"/>
    </linearGradient>
    <linearGradient id="soleEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C6A264"/>
      <stop offset="100%" stop-color="#9C7B43"/>
    </linearGradient>
    <filter id="shoeShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0E1E18" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Silueta elegante y minimalista de zapato que cubre el pie por completo -->
  <g filter="url(#shoeShadow)">
    <!-- Ribete de suela / vira -->
    <path d="M 120 120
             C 80 180, 75 280, 85 380
             C 95 480, 115 570, 140 615
             C 160 635, 240 635, 260 615
             C 285 570, 305 480, 315 380
             C 325 280, 320 180, 280 120
             C 250 50, 150 50, 120 120 Z"
          fill="url(#soleEdge)" stroke="#876732" stroke-width="2"/>

    <!-- Cuerpo principal del zapato -->
    <path d="M 125 125
             C 88 182, 83 278, 93 375
             C 102 472, 121 560, 144 605
             C 162 623, 238 623, 256 605
             C 279 560, 298 472, 307 375
             C 317 278, 312 182, 275 125
             C 246 58, 154 58, 125 125 Z"
          fill="url(#shoeLeather)"/>

    <!-- Puntera / Costura estética de calzado artesanal -->
    <path d="M 105 210 C 150 250, 250 250, 295 210" stroke="#C6A264" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.6" fill="none"/>
    <path d="M 130 110 C 160 85, 240 85, 270 110" stroke="#3D5049" stroke-width="2" fill="none"/>

    <!-- Empeine y lengüeta estilizada -->
    <path d="M 145 270 C 140 380, 150 480, 160 520 C 180 540, 220 540, 240 520 C 250 480, 260 380, 255 270 C 235 255, 165 255, 145 270 Z"
          fill="#16221E" stroke="#25352F" stroke-width="1.5"/>

    <!-- Cordón / Detalle minimalista -->
    <line x1="165" y1="310" x2="235" y2="310" stroke="#C6A264" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="160" y1="350" x2="240" y2="350" stroke="#C6A264" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="165" y1="390" x2="235" y2="390" stroke="#C6A264" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="172" y1="430" x2="228" y2="430" stroke="#C6A264" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Resalte de luz superior -->
    <path d="M 140 135 C 160 90, 240 90, 260 135" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
