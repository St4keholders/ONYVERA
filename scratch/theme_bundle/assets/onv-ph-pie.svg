<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="footSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDBC9"/>
      <stop offset="50%" stop-color="#E4CCB6"/>
      <stop offset="100%" stop-color="#D6B89E"/>
    </linearGradient>
    <linearGradient id="nailGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F7E6D7"/>
      <stop offset="100%" stop-color="#ECCFBA"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B3A2F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sombra ambiental -->
  <ellipse cx="200" cy="520" rx="130" ry="25" fill="#1B3A2F" opacity="0.08"/>

  <!-- Silueta del pie (vista cenital) -->
  <g filter="url(#softShadow)">
    <path d="M 140 160
             C 120 180, 100 240, 105 340
             C 110 430, 125 500, 145 560
             C 160 600, 240 600, 255 560
             C 275 500, 290 430, 295 340
             C 300 240, 280 180, 260 160
             C 245 140, 220 130, 200 130
             C 180 130, 155 140, 140 160 Z"
          fill="url(#footSkin)"/>

    <!-- Dedo gordo -->
    <path d="M 125 180 C 110 150, 115 90, 145 75 C 175 60, 185 100, 180 165 Z" fill="url(#footSkin)"/>
    <!-- Uña dedo gordo -->
    <rect x="132" y="85" width="38" height="32" rx="10" fill="url(#nailGlow)" stroke="#D4B69E" stroke-width="1.2"/>
    <path d="M 137 92 Q 151 88 165 92" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Segundo dedo -->
    <path d="M 180 150 C 178 120, 180 65, 200 60 C 220 55, 225 110, 218 155 Z" fill="url(#footSkin)"/>
    <!-- Uña segundo dedo -->
    <rect x="187" y="68" width="22" height="22" rx="7" fill="url(#nailGlow)" stroke="#D4B69E" stroke-width="1"/>
    <path d="M 191 73 Q 198 70 205 73" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Tercer dedo -->
    <path d="M 218 155 C 220 125, 225 78, 240 75 C 255 72, 258 115, 250 160 Z" fill="url(#footSkin)"/>
    <!-- Uña tercer dedo -->
    <rect x="228" y="82" width="18" height="19" rx="6" fill="url(#nailGlow)" stroke="#D4B69E" stroke-width="1"/>

    <!-- Cuarto dedo -->
    <path d="M 250 160 C 252 135, 258 98, 270 95 C 282 92, 285 125, 278 168 Z" fill="url(#footSkin)"/>
    <!-- Uña cuarto dedo -->
    <rect x="258" y="100" width="15" height="16" rx="5" fill="url(#nailGlow)" stroke="#D4B69E" stroke-width="1"/>

    <!-- Meñique -->
    <path d="M 278 168 C 282 145, 288 120, 298 118 C 308 116, 310 140, 298 180 Z" fill="url(#footSkin)"/>
    <!-- Uña meñique -->
    <rect x="286" y="123" width="12" height="13" rx="4" fill="url(#nailGlow)" stroke="#D4B69E" stroke-width="1"/>

    <!-- Líneas anatómicas suaves del empeine -->
    <path d="M 170 280 C 185 360, 195 440, 195 500" stroke="#CAA88D" stroke-width="2" stroke-linecap="round" opacity="0.3" fill="none"/>
    <path d="M 220 290 C 225 360, 225 430, 220 490" stroke="#CAA88D" stroke-width="1.5" stroke-linecap="round" opacity="0.2" fill="none"/>
  </g>
</svg>
